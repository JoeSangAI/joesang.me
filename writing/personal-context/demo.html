<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每日工作台示例</title>
<style>
:root { color: #171815; font-synthesis: none; background: #f1f0eb; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
* { box-sizing: border-box; }
body { background: #f2f1eb; margin: 0; position: relative; }
button, input, textarea, select { font: inherit; }
button { color: inherit; }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid #38634b; outline-offset: 2px; }
[hidden] { display: none !important; }
.sr-only { clip: rect(0 0 0 0); white-space: nowrap; border: 0; width: 1px; height: 1px; margin: -1px; padding: 0; position: absolute; overflow: hidden; }
details { margin-top: 12px; }
summary { cursor: pointer; color: #38634b; font-size: 14px; }
svg.i { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
.markdown-link { color: #38634b; cursor: pointer; background: none; border: 0; border-bottom: 1px solid #9bb6a1; padding: 0; overflow-wrap: anywhere; text-decoration: none; display: inline; font-size: inherit; }
.markdown-link svg { vertical-align: middle; margin-left: 3px; }
.markdown { overflow-wrap: anywhere; line-height: 1.82; }
.markdown p { margin: .6em 0; }

/* 顶栏 */
.demo-topbar { background: #18473b; border-bottom: 1px solid rgba(255,255,255,.125); }
.desk-header { max-width: 1136px; margin: 0 auto; padding: 0 48px; display: flex; align-items: center; gap: 48px; height: 76px; }
.desk-brand { color: #fffdf5; white-space: nowrap; align-items: center; gap: 16px; font-size: 15px; font-weight: 600; text-decoration: none; display: flex; }
.desk-brand img { object-fit: contain; width: 46px; height: 46px; display: block; }
.desk-brand span { border-left: 1px solid rgba(255,255,255,.25); padding-left: 16px; }
.desk-nav { align-self: stretch; gap: 32px; display: flex; min-width: 0; }
.desk-nav button, .desk-nav .nav-off { color: #d1e1d8; cursor: pointer; background: none; border: 0; min-width: 48px; padding: 0 8px; font-size: 16px; position: relative; white-space: nowrap; display: flex; align-items: center; justify-content: center; }
.desk-nav button:hover, .desk-nav button.selected { color: #fffdf5; }
.desk-nav button.selected { font-weight: 650; }
.desk-nav button.selected::after { content: ""; background: #eb805a; border-radius: 2px 2px 0 0; height: 3px; position: absolute; bottom: -1px; left: 8px; right: 8px; }
.desk-nav .nav-off { opacity: .42; cursor: default; }
.desk-header button:focus-visible, .desk-header a:focus-visible { outline-offset: -8px; outline-color: #fffdf5; }
.demo-badge { margin-left: auto; color: #fffdf5; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.333); border-radius: 6px; padding: 7px 11px; font-size: 12px; white-space: nowrap; }

/* 页面骨架 */
.desk-shell { --ink: #18473b; --text: #202521; --muted: #56615b; --line: #d9dcd5; --surface: #fffefa; --canvas: #f2f1eb; --desk-title-font: "Songti SC", "STSong", Georgia, serif; max-width: 1136px; color: var(--text); -webkit-font-smoothing: antialiased; margin: 0 auto; padding: 0 48px; font-size: 16px; }
.desk-main { max-width: 1040px; margin: auto; padding: 36px 0 56px; }
.desk-title-row, .desk-sources .page-heading { flex-direction: row; justify-content: space-between; align-items: center; gap: 20px; margin: 0 0 28px; display: flex; }
.desk-heading-line { flex-wrap: wrap; align-items: baseline; gap: 20px; display: flex; }
.desk-heading-line h1, .desk-sources .page-heading h1, .discoveries-heading h1 { letter-spacing: 0; color: var(--text); margin: 0; font-size: 28px; font-weight: 650; line-height: 1.35; }
.desk-date { color: var(--muted); white-space: nowrap; font-size: 14px; }
.desk-toolbar { align-items: center; gap: 8px; display: flex; }
.desk-refresh, .desk-context-note { min-height: 38px; color: var(--ink); cursor: pointer; background: #fffefa; border: 1px solid #c9d1c9; border-radius: 7px; justify-content: center; align-items: center; gap: 7px; padding: 8px 13px; font-size: 13px; font-weight: 500; display: flex; box-shadow: 0 1px 2px rgba(24,39,27,.02); }
.desk-refresh:hover, .desk-context-note:hover, .desk-refresh[aria-expanded="true"] { background: #e8ede4; border-color: #a9baa6; }
.status-line { flex-direction: column; gap: 6px; margin: 8px 0 18px; display: flex; }
.status-line-main { cursor: pointer; color: #2f4a3c; text-align: left; background: none; border: 0; align-items: center; gap: 8px; padding: 0; font-size: 15px; display: inline-flex; align-self: flex-start; }
.news-entrance { color: #426247; text-decoration: none; display: flex; align-items: center; background: none; border: 0; border-radius: 5px; gap: 8px; margin: 0 0 12px; padding: 9px 12px; width: 100%; cursor: pointer; text-align: left; }
.news-entrance:hover { background: #e9ede4; }
.news-entrance strong { font-size: 13px; font-weight: 500; }
.news-entrance-count { white-space: nowrap; margin-left: auto; font-size: 12px; color: #71816c; }
.desk-layout { grid-template-columns: minmax(0, 1fr); align-items: start; display: grid; }
.desk-events { min-width: 0; }
.desk-list-heading { justify-content: space-between; align-items: baseline; gap: 12px; padding: 0 2px 14px; display: flex; }
.desk-list-heading.tight { padding-bottom: 8px; }
.desk-list-heading h2 { margin: 0; font-size: 14px; font-weight: 600; }
.desk-list-heading h2 span { color: var(--muted); margin-left: 10px; font-size: 13px; font-weight: 400; }
.desk-list-heading > span { color: var(--muted); font-size: 12px; }

/* 事项卡片 */
.desk-event-list { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin: 0; padding: 0 26px; list-style: none; box-shadow: 0 2px 8px rgba(35,51,34,.01); }
.desk-event { border-bottom: 1px solid var(--line); grid-template-columns: 24px minmax(0, 1fr); gap: 16px; padding: 24px 0 20px; display: grid; position: relative; transition: opacity .35s, transform .35s; }
.desk-event:last-child { border-bottom: 0; }
.desk-event.is-leaving { opacity: 0; transform: translateX(24px); }
.desk-event.is-new { animation: flash 1.8s ease-out; }
@keyframes flash { from { background: rgba(235,128,90,.16); } to { background: transparent; } }
.desk-event-index { color: #727e71; font-variant-numeric: tabular-nums; font-size: 12px; line-height: 29px; }
.desk-event-body { min-width: 0; }
.desk-event-meta { color: #59625e; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 12px; line-height: 1.5; display: flex; }
.desk-event-state { color: #56615b; }
.desk-event-meta > span + span::before { content: "·"; color: #889381; margin-right: 8px; }
.desk-event h3 { font-family: var(--desk-title-font); letter-spacing: .015em; color: #18473b; overflow-wrap: anywhere; margin: 0; font-size: 22px; font-weight: 600; line-height: 1.55; padding-right: 54px; }
.desk-event-title { color: inherit; font: inherit; text-align: left; cursor: pointer; background: none; border: 0; align-items: center; gap: 6px; padding: 0; display: inline-flex; }
.desk-event-title:hover { color: #18473b; }
.desk-event-title svg { color: #6d806f; transition: transform .15s; }
.desk-next-action, .desk-summary { color: #242b27; overflow-wrap: anywhere; max-width: 49em; margin: 9px 0 0; font-size: 16px; line-height: 1.8; }
.desk-next-action { gap: 9px; display: flex; }
.desk-next-action svg { color: #59785d; margin-top: 7px; }
.desk-event-bottom { justify-content: space-between; align-items: center; gap: 12px; min-height: 34px; margin-top: 8px; padding-top: 4px; display: flex; }
.desk-person-list { flex-wrap: wrap; align-items: center; gap: 7px; display: flex; }
.desk-related-label { color: #606761; margin-right: 3px; font-size: 12px; }
.desk-person { position: relative; margin: 0 !important; }
.desk-person summary { color: #405048; cursor: pointer; background: #f4f3ee; border: 1px solid #dfdfd7; border-radius: 5px; align-items: center; gap: 6px; padding: 3px 9px; min-height: 32px; font-size: 13px; line-height: 1.7; list-style: none; display: flex; white-space: nowrap; }
.desk-person summary::-webkit-details-marker { display: none; }
.desk-person summary:hover, .desk-person[open] summary { background: #e8eee9; border-color: #849a8c; }
.desk-person-dot { background: #6c8961; border-radius: 50%; width: 4px; height: 4px; }
.desk-person-popover { z-index: 35; background: #fffefa; color: #354039; overflow-wrap: anywhere; border: 1px solid #bdc8bd; border-radius: 8px; width: min(310px, calc(100vw - 32px)); padding: 18px; font-size: 14px; line-height: 1.75; position: absolute; top: calc(100% + 8px); left: 0; box-shadow: 0 12px 40px rgba(32,56,45,.15); }
.desk-person-popover p { margin: 7px 0; }
.desk-person-popover strong { color: var(--ink); font-size: 16px; }
.desk-person-authority { color: #69716a; margin-top: 10px; font-size: 12px; display: block; }
.desk-person-menu { flex-wrap: wrap; gap: 8px; display: flex; }
.desk-person-correct { color: #214b3d; cursor: pointer; background: #f3f5f0; border: 1px solid #ccd4ce; border-radius: 6px; margin-top: 12px; padding: 7px 10px; font-size: 13px; display: block; }
.desk-person-correct:hover { background: #e9eee7; }
.desk-event:has(.desk-person[open]), .desk-event:has(.desk-placement-menu[open]) { z-index: 12; }
.desk-expand { color: #526c50; cursor: pointer; white-space: nowrap; background: none; border: 0; border-radius: 5px; justify-content: center; align-items: center; gap: 5px; min-height: 34px; padding: 8px 9px; font-size: 13px; display: flex; }
.desk-expand:hover { color: var(--ink); background: #edf1e9; }
.desk-action-row { border-top: 1px solid #e1e5dc; grid-template-columns: minmax(0, 1fr); align-items: start; gap: 8px; margin-top: 13px; padding-top: 12px; display: grid; }
.desk-action-controls { flex-wrap: wrap; justify-content: flex-start; align-items: center; gap: 4px; min-width: 0; display: flex; }
.desk-action-controls :is(.action-circle, .action-text) { color: #244d3d; background: #fffefa; border: 1px solid #bdcabe; border-radius: 6px; flex: 0 0 auto; justify-content: center; align-items: center; gap: 5px; min-width: 72px; height: 40px; padding: 7px 14px; font: 500 14px/1.4 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; display: inline-flex; cursor: pointer; }
.desk-action-controls :is(.action-circle, .action-text):hover:not(:disabled), .desk-action-controls .action-text[aria-expanded="true"] { background: #edf3ee; border-color: #8fa997; }
.card-unread-dot { vertical-align: middle; background: #bc5b4c; border-radius: 50%; width: 7px; height: 7px; margin: 0 0 1px 9px; display: inline-block; }

/* 四象限 */
.desk-quadrant-board { min-width: 0; position: relative; }
.desk-quadrant-nav { background: var(--canvas); border-bottom: 1px solid #d6dbd3; padding: 10px 0 14px; }
.desk-quadrant-tabs { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; display: grid; }
.desk-quadrant-tab { color: #28332b; text-align: left; cursor: pointer; background: #fffefa; border: 1px solid #cbd2c9; border-radius: 8px; flex-direction: column; justify-content: center; gap: 4px; min-width: 0; min-height: 52px; padding: 11px 16px; transition: background-color .14s, border-color .14s, box-shadow .14s; display: flex; }
.desk-quadrant-tab:hover { background: #e9eee7; border-color: #819d89; }
.desk-quadrant-tab[aria-selected="true"] { color: #fffdf5; background: #18473b; border-color: #18473b; box-shadow: 0 2px 5px rgba(22,60,48,.125); }
.desk-quadrant-tab-title { align-items: center; gap: 8px; min-width: 0; display: flex; }
.desk-quadrant-tab-title strong { font-size: 16px; font-weight: 650; white-space: nowrap; }
.desk-quadrant-number { color: #3c5245; background: #e9ede6; border-radius: 5px; flex: 0 0 auto; place-items: center; width: 22px; height: 22px; font-size: 13px; font-weight: 600; display: grid; }
.desk-quadrant-count { color: #415248; font-variant-numeric: tabular-nums; background: #edf0e9; border-radius: 5px; justify-content: center; align-items: center; min-width: 30px; height: 26px; margin-left: auto; font-size: 15px; display: inline-flex; }
.desk-quadrant-tab[aria-selected="true"] .desk-quadrant-number, .desk-quadrant-tab[aria-selected="true"] .desk-quadrant-count { color: #fffdf5; background: rgba(255,255,255,.11); }
.desk-quadrant { border-radius: 9px; min-width: 0; margin-top: 16px; }
.desk-quadrant .desk-event-list { box-shadow: none; background: none; border: 0; border-radius: 0; padding: 0; }
.desk-quadrant .desk-event { background: #fffefa; border: 1px solid #d2d8cf; border-radius: 10px; margin: 0 0 16px; padding: 22px 24px 18px 46px; display: block; box-shadow: 0 2px 5px rgba(36,43,36,.024); transition: border-color .14s, box-shadow .14s, opacity .35s, transform .35s; }
.desk-quadrant .desk-event:last-child { border-bottom: 1px solid #d2d8cf; margin-bottom: 0; }
.desk-quadrant .desk-event:hover { border-color: #a9b9a9; box-shadow: 0 3px 10px rgba(36,43,36,.035); }
.desk-quadrant .desk-event-index { display: none; }
.desk-quadrant .desk-event h3 { line-height: 1.6; display: block; }
.desk-board-event .desk-event-title { width: 100%; padding-right: 18px; display: block; position: relative; }
.desk-board-event .desk-event-title svg { position: absolute; top: 7px; right: 0; }
.desk-board-event .desk-next-action { max-width: none; margin-top: 10px; line-height: 1.85; }
.desk-board-event .desk-event-meta { margin: 0 50px 4px 0; font-size: 13px; line-height: 1.6; }
.desk-card-dates { color: #5b665d; flex-wrap: wrap; gap: 6px 16px; margin: 4px 0 0; font-size: 13px; display: flex; font-variant-numeric: tabular-nums; }
.desk-timing-due { color: #9a3c30; font-weight: 600; }
.desk-timing-review { color: #80571d; font-weight: 600; }
.desk-board-event .desk-action-row { gap: 9px; margin-top: 12px; padding-top: 10px; }
.desk-board-event .desk-action-controls { gap: 12px; }
.desk-quadrant-empty { color: var(--muted); font-size: 14px; padding: 22px 4px; }
.desk-placement-menu { position: absolute; top: 16px; left: 8px; z-index: 6; margin: 0 !important; }
.desk-drag-handle { color: #627669; cursor: pointer; border-radius: 5px; place-items: center; width: 30px; height: 34px; list-style: none; display: grid; }
.desk-drag-handle::-webkit-details-marker { display: none; }
.desk-drag-handle:hover, .desk-placement-menu[open] .desk-drag-handle { color: #18473b; background: #e5ede1; }
.desk-placement-options { position: absolute; top: 38px; left: 0; width: 168px; background: #fffefa; border: 1px solid #cbd2c9; border-radius: 8px; padding: 6px; box-shadow: 0 10px 28px rgba(35,51,34,.16); }
.desk-placement-options small { color: #6d7d70; font-size: 12px; display: block; padding: 4px 8px 6px; }
.desk-placement-options button { text-align: left; color: #355b41; cursor: pointer; background: none; border: 0; border-radius: 5px; width: 100%; padding: 8px; font-size: 14px; display: block; }
.desk-placement-options button:hover:not(:disabled) { background: #edf1e9; }
.desk-placement-options button:disabled { opacity: .45; cursor: default; }
.desk-card-intelligence { z-index: 1; position: absolute; top: 18px; right: 18px; display: flex; align-items: center; }
.card-codex { cursor: pointer; color: #18473b; background: #edf3ee; border: 1px solid #cbd9cf; border-radius: 10px; flex: 0 0 40px; justify-content: center; align-items: center; width: 40px; height: 40px; padding: 7px; display: inline-flex; box-shadow: 0 1px 3px rgba(24,71,59,.04); transition: transform .18s, box-shadow .18s, background .18s; }
.card-codex:hover { background: #e1ece3; border-color: #8ea999; transform: translateY(-1px); box-shadow: 0 0 0 4px rgba(24,71,59,.04); }
.card-codex svg { width: 24px; height: 24px; display: block; }

/* 记一下 / 回应 */
.desk-inline-composer { max-width: 700px; margin: 0 0 28px; }
.desk-inline-composer > .desk-expand { margin-left: auto; }
.desk-context-composer { margin-top: 14px; margin-bottom: 0; }
.desk-note-panel { background: var(--surface); border: 1px solid #cfdac8; border-radius: 10px; padding: 24px; }
.desk-context-composer .desk-note-panel { background: #f7f8f3; border-color: #bbc9be; }
.desk-note-heading { color: var(--ink); align-items: center; gap: 10px; display: flex; min-width: 0; }
.desk-note-heading h2 { margin: 0; font-size: 17px; font-weight: 600; white-space: nowrap; }
.desk-note-heading > span { text-overflow: ellipsis; white-space: nowrap; color: #65735f; min-width: 0; max-width: 70%; font-size: 12px; overflow: hidden; }
.desk-note-panel form { margin-top: 20px; }
.desk-note-line { background: #fffefa; border: 1px solid #becdb5; border-radius: 6px; align-items: center; display: flex; overflow: hidden; }
.desk-note-line:focus-within { outline: 2px solid #38634b; outline-offset: 2px; }
.desk-note-line input { color: #283e2d; background: none; border: 0; outline: 0; width: 100%; min-width: 0; padding: 12px 13px; font-size: 15px; line-height: 1.5; }
.attachment-button { color: #476449; background: none; border: 0; border-left: 1px solid #d3ddd0; place-items: center; width: 40px; height: 40px; display: grid; opacity: .42; cursor: not-allowed; flex: 0 0 auto; }
.desk-note-submit { justify-content: space-between; align-items: center; gap: 8px; margin-top: 12px; min-height: 36px; display: flex; }
.desk-note-submit > span { color: #59625e; font-size: 12px; }
.desk-note-submit button { color: #f1f0eb; background: var(--ink); cursor: pointer; border: 0; border-radius: 6px; align-items: center; gap: 7px; padding: 10px 16px; font-size: 14px; display: flex; }
.desk-note-submit button:hover { background: #2e5c44; }
.desk-recent-notes { border-top: 1px solid var(--line); margin-top: 22px; padding-top: 18px; }
.desk-recent-notes h3 { color: #4b6740; margin: 0 0 12px; font-size: 14px; }
.desk-saved-note { margin: 12px 0 0; }
.desk-saved-note > span { color: #776126; font-size: 12px; }
.desk-saved-note > span.is-done { color: #4c7a5a; }
.desk-saved-note p { white-space: pre-wrap; overflow-wrap: anywhere; color: #43583a; margin: 4px 0; font-size: 14px; line-height: 1.8; }
.desk-saved-note .desk-note-feedback { color: #365d40; border-left: 2px solid #9bb28b; margin-top: 10px; padding-left: 10px; }

/* 详情弹层 */
.desk-dialog-backdrop { --ink: #18473b; --text: #242b27; --line: #dde0d8; --surface: #fffefa; z-index: 50; background: rgba(23,43,36,.28); padding: 0 24px; position: absolute; inset: 0; color: #242b27; font-size: 16px; }
.desk-detail-drawer { background: #fffefa; border: 1px solid #c7d0c5; border-radius: 14px; width: min(800px, 100%); margin: 0 auto; padding: 28px 34px 32px; position: relative; box-shadow: 0 24px 80px rgba(19,43,36,.24); }
.desk-detail-drawer > header { justify-content: space-between; align-items: flex-start; gap: 18px; background: #fffefa; border-bottom: 1px solid #dde0d8; margin: -4px 0 22px; padding: 4px 0 16px; display: flex; }
.desk-detail-drawer h2 { color: #18473b; letter-spacing: .015em; margin: 0; font: 600 26px/1.5 "Songti SC", STSong, Georgia, serif; overflow-wrap: anywhere; min-width: 0; }
.desk-detail-header-actions { flex: 0 0 auto; align-items: center; gap: 10px; display: flex; }
.desk-detail-drawer > header button.dialog-close, .desk-detail-header-actions > button.dialog-close { color: #526c50; cursor: pointer; background: none; border: 0; border-radius: 5px; place-items: center; width: 40px; height: 40px; display: grid; }
.desk-detail-drawer > header button.dialog-close:hover { color: var(--ink); background: #e8ede4; }
.desk-drawer-plan { background: #f0f4ee; border-radius: 7px; gap: 12px; padding: 14px 16px; display: grid; margin: 0 0 24px; }
.desk-drawer-plan p { color: #28362e; gap: 5px; font-size: 16px; display: grid; margin: 0; line-height: 1.7; }
.desk-drawer-plan b { color: #607066; font: 500 12px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
.desk-detail-section { margin: 0 0 24px; }
.desk-detail-section h3 { color: #5b6c62; margin: 0 0 8px; font: 600 13px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
.desk-detail-section .desk-person-list { margin: 10px 0 0; }
.desk-detail-section .markdown p { color: #303a33; font-size: 16px; line-height: 1.85; margin: 0; }
.desk-detail-sources .markdown-link { overflow-wrap: anywhere; max-width: 100%; margin: 0 18px 8px 0; display: inline-flex; align-items: center; gap: 3px; font-size: 15px; }
.desk-detail-history { color: #58675e; border-top: 1px solid #dde0d8; margin-top: 0; }
.desk-detail-history > summary { cursor: pointer; align-items: center; gap: 7px; width: fit-content; padding: 12px 0; font-size: 13px; list-style: none; display: flex; }
.desk-detail-history > summary::-webkit-details-marker { display: none; }
.desk-detail-history > summary::before { content: "›"; font-size: 18px; line-height: 1; display: inline-block; transition: transform .15s; }
.desk-detail-history[open] > summary::before { transform: rotate(90deg); }
.desk-detail-history .markdown p { font-size: 15px; line-height: 1.9; color: #303a33; margin: 0 0 12px; }
.desk-drawer-action { margin: 0 0 14px; }
.desk-drawer-action small { color: #68716b; font-size: 12px; }
.desk-history-feedback { white-space: pre-wrap; color: #46564b; border-left: 2px solid #d3dbd3; margin: 6px 0 0; padding: 0 0 0 12px; font-size: 14px; line-height: 1.85; }
.desk-drawer-action.is-new .desk-history-feedback { border-left-color: #eb805a; color: #2c3d32; }
.desk-detail-controls { border-top: 1px solid #dde0d8; margin-top: 8px; padding-top: 18px; }
.desk-context-note { display: inline-flex; }
.desk-related-count { color: #617168; margin: 0 0 20px; font-size: 14px; }
.desk-related-items { gap: 16px; margin: 0; padding: 0; list-style: none; display: grid; }
.desk-related-card { background: #fffefa; border: 1px solid #d6ded4; border-radius: 9px; padding: 18px 20px; }
.desk-related-card .desk-event-meta { margin-bottom: 0; }
.desk-related-card h3 { color: #18473b; margin: 9px 0 12px; font: 600 22px/1.5 "Songti SC", STSong, Georgia, serif; }
.desk-related-card h3 button { color: inherit; font: inherit; text-align: left; cursor: pointer; background: none; border: 0; padding: 0; }
.desk-related-card .desk-next-action { white-space: pre-wrap; margin: 0; display: block; }
.desk-related-card .desk-next-action b { color: #617168; margin-bottom: 5px; font: 500 12px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; display: block; }
.desk-related-card > .desk-expand { margin: 12px 0 0 auto; }

/* 昨日 */
.desk-date-control { align-items: center; gap: 5px; margin: -8px 0 26px; display: flex; }
.desk-date-control button, .desk-date-control input { color: #46603f; background: #f8f8f3; border: 1px solid #cbd3c8; border-radius: 6px; min-height: 36px; padding: 8px; font-size: 13px; }
.desk-date-control button { cursor: pointer; align-items: center; display: flex; }
.desk-date-control input { padding: 7px 10px; }
.desk-date-control button:disabled { opacity: .35; cursor: default; }

/* 发现 */
.discoveries-page { max-width: 960px; margin: 0 auto; }
.discoveries-heading { justify-content: space-between; align-items: center; gap: 20px; margin: 0 0 18px; display: flex; }
.discoveries-toolbar { align-items: center; gap: 12px; display: flex; }
.discoveries-toolbar label { color: #627166; align-items: center; gap: 8px; font-size: 13px; display: flex; white-space: nowrap; }
.discoveries-toolbar select { appearance: none; -webkit-appearance: none; color: #294e3f; background: #fffefa; border: 1px solid #cdd6cb; border-radius: 6px; min-height: 36px; padding: 7px 28px 7px 10px; max-width: 160px; }
.discoveries-toolbar label svg { pointer-events: none; margin-left: -30px; }
.discoveries-filters { border-bottom: 1px solid var(--line); gap: 18px; margin: 0 0 14px; display: flex; }
.discoveries-filters button { color: #607064; cursor: pointer; background: none; border: 0; border-bottom: 2px solid transparent; align-items: center; gap: 7px; min-height: 39px; padding: 6px 2px 9px; font-size: 14px; display: flex; white-space: nowrap; }
.discoveries-filters button[aria-pressed="true"] { color: #18473b; border-bottom-color: #eb805a; font-weight: 650; }
.discoveries-filters span { color: #859187; font-size: 12px; font-weight: 400; }
.discoveries-undo { display: flex; align-items: center; gap: 10px; background: #f4f6f1; border: 1px solid #d8dfd5; border-radius: 7px; padding: 8px 12px; margin: 0 0 14px; font-size: 13px; color: #3d5043; }
.discoveries-undo span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.discoveries-undo button { background: none; border: 0; color: #2b6a4f; cursor: pointer; padding: 2px 4px; font-size: 13px; }
.attention-panel { background: #f8f9f5; border: 1px solid #d8dfd5; border-radius: 8px; margin: 0 0 14px; }
.attention-panel > summary { cursor: pointer; color: #194d40; align-items: center; gap: 10px; padding: 10px 14px; font-size: 14px; font-weight: 600; list-style: none; display: flex; }
.attention-panel > summary::-webkit-details-marker { display: none; }
.attention-panel > summary::after { content: "展开"; color: #6d7d70; margin-left: auto; font-size: 12px; font-weight: 400; }
.attention-panel[open] > summary::after { content: "收起"; }
.attention-panel summary small { color: #6d7d70; font-size: 12px; font-weight: 400; }
.attention-body { gap: 12px; padding: 0 14px 14px; display: grid; }
.attention-body section { min-width: 0; }
.attention-body h3 { color: #67806c; margin: 0 0 6px; font-size: 12px; font-weight: 600; }
.attention-body ul { gap: 7px; margin: 0; padding: 0; list-style: none; display: grid; }
.attention-body li > div { color: #26372e; align-items: center; gap: 8px; font-size: 14px; display: flex; }
.attention-body li p { color: #6a776c; overflow-wrap: anywhere; margin: 2px 0 0; font-size: 12px; line-height: 1.6; }
.attention-level { color: #4f6955; background: #e7ede5; border-radius: 4px; padding: 0 6px; font-size: 11px; line-height: 18px; }
.attention-level[data-level="高"] { color: #8a4b2c; background: #f6e3d8; }
.attention-composer { align-items: center; gap: 8px; display: flex; }
.attention-composer input { min-width: 0; color: #26372e; background: #fffefa; border: 1px solid #b6c7bc; border-radius: 6px; flex: 1 1 0; padding: 8px 10px; font-size: 14px; }
.attention-composer button { color: #fff; cursor: pointer; white-space: nowrap; background: #194d40; border: 0; border-radius: 6px; align-items: center; gap: 4px; padding: 8px 11px; font-size: 13px; display: inline-flex; justify-content: center; }
.attention-composer button:disabled { opacity: .45; cursor: default; }
.discoveries-list { margin-top: 3px; }
.discoveries-list > li { list-style: none; }
.discoveries-list .desk-event { padding: 25px 0; }
.discovery-title-row { justify-content: space-between; align-items: flex-start; gap: 15px; display: flex; }
.discovery-title-row .card-codex { margin: -7px -9px 0 0; }
.discovery-title { min-width: 0; color: inherit; text-align: left; cursor: pointer; background: none; border: 0; flex: 1 1 0; justify-content: space-between; align-items: center; gap: 12px; padding: 0; display: flex; }
.discovery-title h3 { flex: 1 1 0; padding-right: 0; }
.discovery-title svg { color: #788477; transition: transform .16s; }
.discovery-title[aria-expanded="true"] svg { transform: rotate(180deg); }
.discovery-relation { color: #8a4b2c; max-width: 50em; margin: 9px 0 0; font-size: 14px; line-height: 1.7; }
.discovery-body { color: #28332c; overflow-wrap: anywhere; max-width: 50em; margin-top: 13px; font-size: 16px; line-height: 1.88; }
.discovery-body > p { margin: 0; }
.discovery-body > p + p { margin-top: .6em; }
.discovery-read-more { color: #426c50; cursor: pointer; background: none; border: 0; margin: 8px 0 0; padding: 3px 0; font-size: 13px; width: max-content; display: block; }
.discovery-primary-source { color: #315d42; background: none; border: 0; border-bottom: 1px solid #a9bfae; align-items: center; gap: 5px; margin-top: 13px; padding: 0; font-size: 13px; width: max-content; display: flex; cursor: pointer; }
.discovery-actions { align-items: center; gap: 8px; margin-top: 17px; display: flex; }
.discovery-actions button { color: #526958; cursor: pointer; background: none; border: 1px solid transparent; border-radius: 6px; justify-content: center; align-items: center; gap: 6px; min-width: 34px; min-height: 34px; padding: 5px; display: inline-flex; }
.discovery-actions .discovery-respond { color: #194d40; background: #edf2ed; border-color: #b6c7bc; padding: 5px 11px; }
.discovery-actions button:hover { background: #e8ede6; }
.discovery-actions button[aria-pressed="true"] { color: #b4553a; }
.discovery-actions button[aria-pressed="true"] svg { fill: currentColor; }
.discovery-composer { background: #fffefa; border: 1px solid #b6c7bc; border-radius: 8px; align-items: flex-end; gap: 9px; margin-top: 12px; padding: 11px; display: flex; }
.discovery-composer textarea { resize: vertical; color: #26372e; min-width: 0; background: none; border: 0; outline: none; flex: 1 1 0; font-size: 15px; line-height: 1.7; }
.discovery-composer button { color: #fff; cursor: pointer; background: #194d40; border: 0; border-radius: 6px; align-items: center; gap: 5px; padding: 8px 11px; display: flex; white-space: nowrap; }
.discovery-response { color: #3d5043; background: #f4f6f1; border-radius: 7px; margin-top: 15px; padding: 13px 15px; font-size: 14px; line-height: 1.75; }
.discovery-response strong { color: #67806c; font-size: 12px; font-weight: 600; display: block; }
.discovery-response p { margin: 6px 0 0; }
.discovery-feedback { border-top: 1px solid #dce4d9; margin-top: 11px; padding-top: 10px; }
.discovery-feedback.is-pending { color: #8a7a4a; }
.discoveries-empty { color: var(--muted); font-size: 14px; padding: 26px 0; list-style: none; }

/* 来源 */
.catalog-summary { color: #2f4a3c; margin: 8px 0 14px; font-size: 15px; }
.catalog-group { margin: 18px 0 6px; }
.catalog-group h2 { color: #7a8079; letter-spacing: .04em; margin: 0 0 4px; font-size: 13px; font-weight: 500; }
.catalog-item { border-top: 1px solid #e3e6e1; }
.catalog-row { text-align: left; cursor: pointer; width: 100%; color: #2c332e; background: none; border: 0; grid-template-columns: minmax(0,1fr) minmax(0,1.8fr) minmax(0,.9fr) minmax(0,.8fr); grid-template-areas: "name what cadence updated" "today today today today"; align-items: center; gap: 2px 12px; padding: 10px 0; font-size: 14px; display: grid; }
.catalog-row:hover .catalog-today, .catalog-row[aria-expanded="true"] .catalog-today { color: #38634b; }
.catalog-name { grid-area: name; align-items: center; gap: 8px; font-weight: 500; display: inline-flex; }
.catalog-what { color: #636b64; grid-area: what; }
.catalog-cadence { color: #636b64; grid-area: cadence; }
.catalog-updated { color: #636b64; text-align: right; grid-area: updated; font-variant-numeric: tabular-nums; }
.catalog-today { color: #8a918a; grid-area: today; padding-left: 15px; font-size: 12px; }
.catalog-dot { border-radius: 50%; width: 7px; height: 7px; display: inline-block; flex: 0 0 auto; }
.dot-ok { background: #4c9a68; } .dot-working { background: #2f7fbf; } .dot-waiting { background: #8b928d; } .dot-needs_you { background: #d0782f; }
.catalog-detail { padding: 0 0 14px 15px; }
.health-meta { color: #5f6d56; font-size: 12px; margin: 0 0 8px; }
.catalog-records { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.catalog-records li { display: grid; grid-template-columns: 44px minmax(0,1fr); gap: 10px; font-size: 13px; line-height: 1.7; color: #3d4a41; }
.catalog-records time { color: #8a918a; font-variant-numeric: tabular-nums; }
.catalog-records b { font-weight: 500; color: #18473b; }
.catalog-uncollected { color: #636b64; margin: 18px 0 6px; font-size: 14px; }
.catalog-uncollected p { margin: 8px 0; font-size: 13px; }
.catalog-legend { color: #8a918a; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 12px; display: flex; margin: 16px 0 0; }

/* 提示 */
.toast { position: absolute; left: 50%; top: 0; z-index: 80; transform: translate(-50%, 6px); background: #18473b; color: #fffdf5; padding: 8px 16px; border-radius: 999px; font-size: 13px; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; max-width: calc(100% - 32px); text-align: center; box-shadow: 0 6px 20px rgba(24,71,59,.22); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

}

}

  .discoveries-heading { flex-wrap: wrap; align-items: flex-start; }
  .discoveries-toolbar { justify-content: flex-start; gap: 8px; width: 100%; }
  .discoveries-toolbar label { font-size: 12px; }
  .discoveries-toolbar select { max-width: 130px; padding-right: 23px; }
  .discoveries-filters { gap: 14px; }
  .discoveries-list { padding: 0 15px; }
  .discoveries-list .desk-event { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .discoveries-list .desk-event-index { font-size: 12px; line-height: 1.2; }
  .discovery-body { font-size: 15px; line-height: 1.83; }
  .discovery-title-row .card-codex { margin-top: -5px; }
  .attention-composer { flex-direction: column; align-items: stretch; }
}
@media (max-width: 640px) {
  .catalog-row { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "name updated" "what what" "cadence cadence" "today today"; }

}
@media (max-width: 600px) {
  .desk-header { flex-wrap: wrap; row-gap: 4px; height: auto; min-height: 76px; padding-top: 10px; padding-bottom: 10px; }

  .desk-related-label { display: none; }

  .desk-expand { padding: 7px 4px; font-size: 12px; }

  .desk-note-panel { padding: 18px; }
  .desk-detail-drawer { padding: 18px 16px; }
  .desk-detail-drawer h2 { font-size: 21px; }
  .desk-related-card { padding: 16px; }

}

@media (prefers-reduced-motion: reduce) {

/* 浮层若超出页面底部，临时撑高页面，避免在 iframe 里被截断 */
function fit(el) {
  if (!el) return;

let toastTimer;
function toast(text, anchor) {
  const el = $("#toast");
  el.textContent = text;
  let top = window.scrollY + 16;
  if (anchor && anchor.isConnected) {
    const r = anchor.getBoundingClientRect();
    top = r.top + window.scrollY - 46;
    if (top < window.scrollY + 8) top = r.bottom + window.scrollY + 10;
  }
  el.style.top = Math.max(8, top) + "px";
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
}

    <section class="page-heading"><h1>来源</h1></section>
    <p class="catalog-summary" role="status">已接入 13 个来源 · 最近采集 09:30</p>
    ${SOURCES.map(g => `<section class="catalog-group" aria-label="${g.g}"><h2>${g.g}</h2>${g.rows.map(r => { const id = "s" + (n++); const open = openSource === id; return `<div class="catalog-item"><button type="button" class="catalog-row" aria-expanded="${open}" data-source="${id}"><span class="catalog-name"><span class="catalog-dot dot-${r.dot}" title="${{ ok: "正常", working: "处理中", waiting: "待更新", needs_you: "需要你" }[r.dot]}"></span>${esc(r.n)}</span><span class="catalog-what">${esc(r.what)}</span><span class="catalog-cadence">${esc(r.cad)}</span><span class="catalog-updated">${esc(r.up)}</span><span class="catalog-today">${open ? "收起记录" : "查看记录"}</span></button>${open ? `<div class="catalog-detail"><p class="health-meta">今日来源记录：已核对 ${r.ok} 条，后台队列 ${r.wait} 条。按消息片段或原件计数，不等于待办事项。</p><ul class="catalog-records">${r.rec.map(x => `<li><time>${x[0]}</time><span>${esc(x[1])} · ${esc(x[2])}${x[3] ? ` → 归入<b>「${esc(x[3])}」</b>` : ""}</span></li>`).join("")}</ul><p class="health-meta" style="margin-top:8px">以上为示例记录；实际页面里每条都能点开原文。</p></div>` : ""}</div>`; }).join("")}</section>`).join("")}
    <details class="catalog-uncollected"><summary>未采集的 ${UNCOLLECTED.length} 项</summary>${UNCOLLECTED.map(x => `<p><strong>${x[0]}</strong>：${x[1]}</p>`).join("")}</details>
    <p class="catalog-legend"><span class="catalog-dot dot-ok"></span>正常 <span class="catalog-dot dot-working"></span>处理中 <span class="catalog-dot dot-waiting"></span>待更新 <span class="catalog-dot dot-needs_you"></span>需要你</p>
  </section>`;
}

/* ---------- 弹层：详情与所有相关 ---------- */
let opener = null;
function openDialog(label, html, anchor) {
  const prev = document.querySelector(".desk-detail-drawer");
  const y = prev ? parseFloat(prev.style.marginTop) + 160 : anchor && anchor.isConnected ? anchor.getBoundingClientRect().top + window.scrollY : window.scrollY;
  closeDialog(true);
  const back = document.createElement("div");
  back.className = "desk-dialog-backdrop";
  back.setAttribute("data-modal-layer", "");
  back.innerHTML = `<section class="desk-detail-drawer" role="dialog" aria-modal="true" aria-label="${esc(label)}">${html}</section>`;
  document.body.appendChild(back);
  const panel = back.firstElementChild;
  panel.style.marginTop = Math.max(16, y - 160) + "px";
  $("#shell").inert = true; document.querySelector(".demo-topbar").inert = true;
  if (!opener) opener = anchor;
  fit(panel);
  const close = panel.querySelector(".dialog-close");
  if (close) close.focus({ preventScroll: true });
  post();
}
function closeDialog(silent) {
  const back = document.querySelector(".desk-dialog-backdrop");
  if (!back) return;
  back.remove();
  $("#toast").classList.remove("show");
  $("#shell").inert = false; document.querySelector(".demo-topbar").inert = false;
  if (!silent) {
    unfit();
    if (opener && opener.isConnected) opener.focus({ preventScroll: true });
    opener = null;
    post();
  }
}
function showDetail(id, anchor) {
  const it = find(id); if (!it) return;
  const isToday = items.includes(it);
  const hist = it.hist.map(h => `<div class="desk-drawer-action${h.isNew ? " is-new" : ""}"><small>${esc(h.d)}</small><p class="desk-history-feedback">${esc(h.t)}</p></div>`).join("");
  const html = `<header><h2>${esc(it.title)}</h2><div class="desk-detail-header-actions">${codexBtn()}<button type="button" class="dialog-close" data-close-dialog aria-label="关闭详情">${ic("x", 20)}</button></div></header>
    ${isToday ? `<section class="desk-drawer-plan" aria-label="行动安排"><p><b>下一步</b>${esc(it.next)}</p>${it.due ? `<p><b>约定日期</b>${esc(it.due)}</p>` : ""}</section>` : `<section class="desk-detail-section"><h3>当天进展</h3><div class="markdown"><p>${esc(it.summary)}</p></div></section>`}
    ${it.bg ? `<details class="desk-detail-history"><summary>相关背景</summary><div class="markdown"><p>${esc(it.bg)}</p></div></details>` : ""}
    ${it.people.length ? `<section class="desk-detail-section"><h3>关键合作人</h3><div class="desk-person-list">${personChips(it.people)}</div></section>` : ""}
    <section class="desk-detail-section desk-detail-sources"><h3>依据</h3>${it.evi.map(e => `<button type="button" class="markdown-link" data-evidence>${esc(e)}${ic("ext", 13)}</button>`).join("")}</section>
    <details class="desk-detail-history" open><summary>推进记录</summary>${hist || `<p class="desk-history-feedback">还没有推进记录。</p>`}</details>
    <div class="desk-action-controls desk-detail-controls"><button type="button" class="desk-context-note" data-dialog-reply="${it.id}">回应</button></div>`;
  openDialog("事项详情", html, anchor);
}
function showRelated(name, anchor) {
  const rel = items.filter(it => it.people.includes(name));
  const html = `<header><h2>${esc(name)} · 所有相关</h2><button type="button" class="dialog-close" data-close-dialog aria-label="关闭所有相关">${ic("x", 20)}</button></header>
    <p class="desk-related-count">${rel.length} 件未完成事项 · 全部象限</p>
    <ol class="desk-related-items">${rel.map(it => `<li class="desk-related-card"><div class="desk-event-meta"><span>${QUADS[it.q].label}</span><span>${esc(it.state)}</span></div><h3><button type="button" data-detail="${it.id}">${esc(it.title)}</button></h3><p class="desk-next-action"><b>下一步</b>${esc(it.next)}</p><button type="button" class="desk-expand" data-detail="${it.id}">详情 ${ic("chevronDown", 15)}</button></li>`).join("")}</ol>`;
  openDialog("所有相关", html, anchor);
}

/* ---------- 页面切换 ---------- */
let page = "today";
function render() {
  if (page === "today") renderToday();
  if (page === "yesterday") renderYesterday();
  if (page === "discoveries") renderDiscoveries();
  if (page === "sources") renderSources();
  post();
}
function go(name) {
  page = name;
  document.querySelectorAll(".desk-nav button").forEach(b => { const on = b.dataset.go === name; b.classList.toggle("selected", on); if (on) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  document.querySelectorAll("[data-page]").forEach(s => { s.hidden = s.dataset.page !== name; });
  composer = null;
  closeDialog(true); document.body.style.minHeight = ""; opener = null;
  render();
}

/* ---------- 交互 ---------- */
function closePopovers(except) {
  document.querySelectorAll(".desk-person[open], .desk-placement-menu[open]").forEach(d => { if (d !== except) d.open = false; });
}
document.addEventListener("toggle", e => {
  const d = e.target;
  if (!(d instanceof HTMLDetailsElement)) return;
  if (d.open && (d.classList.contains("desk-person") || d.classList.contains("desk-placement-menu"))) {
    closePopovers(d);
    const pop = d.querySelector(".desk-person-popover");
    if (pop) {
      pop.style.left = "0px";
      const r = pop.getBoundingClientRect(), vw = document.documentElement.clientWidth;
      let shift = 0;
      if (r.right > vw - 16) shift = vw - 16 - r.right;
      if (r.left + shift < 16) shift = 16 - r.left;
      pop.style.left = shift + "px";
    }
    fit(pop || d.querySelector(".desk-placement-options"));
  } else if (!d.open) unfit();
  if (d.id === "attention") attentionOpen = d.open;
  post();
}, true);

document.addEventListener("click", e => {
  const t = e.target.closest("button, a, summary");
  if (!e.target.closest(".desk-person, .desk-placement-menu")) closePopovers();
  if (e.target.classList && e.target.classList.contains("desk-dialog-backdrop")) { closeDialog(); return; }
  if (!t) return;
  const ds = t.dataset;
  if (ds.go) { e.preventDefault(); go(ds.go); return; }
  if (ds.closeDialog !== undefined) { closeDialog(); return; }
  if (ds.codex !== undefined) { toast("实际工作台会带着这件事的背景打开 Codex", t); return; }
  if (ds.evidence !== undefined) { toast("实际工作台里点开就是原文；示例不提供原文", t); return; }
  if (ds.sourceNote) { toast("示例条目，原文来自：" + ds.sourceNote, t); return; }

  // 今日
  if (ds.q) { quad = +ds.q; composer = null; render(); return; }
  if (t.id === "noteBtn") { noteOpen = !noteOpen; render(); if (noteOpen) $("#noteInput").focus({ preventScroll: true }); return; }
  if (ds.noteFromYesterday !== undefined) { noteOpen = true; go("today"); $("#noteInput").focus({ preventScroll: true }); return; }
  if (ds.closeNote !== undefined) { noteOpen = false; render(); return; }
  if (ds.detail) { showDetail(ds.detail, t); return; }
  if (ds.related) { const d = t.closest("details"); if (d) d.open = false; const anchor = t.closest(".desk-person") ? t.closest(".desk-person").querySelector("summary") : t; showRelated(ds.related, anchor); return; }
  if (ds.correct) {
    const d = t.closest("details"); if (d) d.open = false;
    const card = t.closest("[data-card]");
    if (card) { composer = { id: card.dataset.card }; render(); const input = document.querySelector(`[data-reply-form="${card.dataset.card}"] input`); if (input) { input.placeholder = `比如：${ds.correct}其实是对方的品牌负责人`; input.focus({ preventScroll: true }); } }
    else { const r = t.closest(".desk-detail-drawer") && t.closest(".desk-detail-drawer").querySelector("[data-dialog-reply]"); closeDialog(true); unfit(); opener = null; if (r) { composer = { id: r.dataset.dialogReply }; render(); const input = document.querySelector(`[data-reply-form="${r.dataset.dialogReply}"] input`); if (input) { input.placeholder = `比如：${ds.correct}其实是对方的品牌负责人`; input.focus({ preventScroll: true }); } } else post(); }
    return;
  }
  if (ds.reply) { composer = composer && composer.id === ds.reply && !composer.sent ? null : { id: ds.reply }; render(); const input = document.querySelector(`[data-reply-form="${ds.reply}"] input`); if (input) input.focus({ preventScroll: true }); return; }
  if (ds.dialogReply) { const id = ds.dialogReply; closeDialog(true); unfit(); opener = null; composer = { id }; render(); const input = document.querySelector(`[data-reply-form="${id}"] input`); if (input) input.focus({ preventScroll: true }); return; }
  if (ds.closeComposer !== undefined) { composer = null; render(); return; }
  if (ds.move) {
    const it = find(ds.move), to = +ds.to;
    it.q = to; render(); toast(`已移到「${QUADS[to].label}」`, document.querySelector(".desk-quadrant-tabs")); return;
  }
  if (ds.done) {
    const it = find(ds.done), card = t.closest(".desk-event");
    const finish = () => {
      items = items.filter(x => x !== it);
      it.state = "已完成"; it.time = "刚刚"; it.summary = "已完成：" + it.next; it.fresh = true;
      it.hist = it.hist.concat([{ d: "刚刚", t: "你标记了完成。", isNew: true }]);
      days[0].list.unshift(it);
      if (composer && composer.id === it.id) composer = null;
      const tabs = document.querySelector(".desk-quadrant-tabs");
      render();
      toast(`已完成，记入昨日 · ${days[0].label.replace(/星期.$/, "")}`, tabs);
    };
    card.classList.add("is-leaving");
    setTimeout(finish, reduced() ? 0 : 350);
    return;
  }

  // 昨日
  if (t.id === "yprev" && day < days.length - 1) { day++; composer = null; render(); return; }
  if (t.id === "ynext" && day > 0) { day--; composer = null; render(); return; }

  // 发现
  if (ds.filter) { filter = ds.filter; replyDisc = null; render(); return; }
  if (ds.discOpen) { const id = ds.discOpen; openDisc.has(id) ? openDisc.delete(id) : openDisc.add(id); render(); return; }
  if (ds.discReply) { replyDisc = replyDisc === ds.discReply ? null : ds.discReply; render(); const ta = document.querySelector(`[data-disc-form="${ds.discReply}"] textarea`); if (ta) ta.focus({ preventScroll: true }); return; }
  if (ds.discUseful || ds.discDismiss) {
    const id = ds.discUseful || ds.discDismiss, it = discoveries.find(d => d.id === id), prev = it.status;
    const card = t.closest(".discovery-card");
    if (ds.discUseful) it.status = prev === "useful" ? "new" : "useful";
    else it.status = prev === "dismissed" ? "new" : "dismissed";
    const name = { new: "新发现", useful: "有启发", dismissed: "已忽略" }[it.status];
    const verb = it.status === "useful" ? "已标记有启发" : it.status === "dismissed" ? "已忽略" : "已放回新发现";
    undo = { id, prev, text: `${verb}「${esc(it.title.slice(0, 18))}…」` };
    const anchor = card;
    toast(it.status === "dismissed" ? "已忽略，以后少推类似内容" : `${verb}，可在「${name}」里找到`, anchor);
    if (replyDisc === id) replyDisc = null;
    render(); return;
  }
  if (ds.undo !== undefined && undo) { const it = discoveries.find(d => d.id === undo.id); it.status = undo.prev; undo = null; render(); return; }
  if (ds.undoClose !== undefined) { undo = null; render(); return; }

  // 来源
  if (ds.source) { openSource = openSource === ds.source ? null : ds.source; render(); return; }
});

document.addEventListener("change", e => {
  if (e.target.id === "ydate") { const i = days.findIndex(d => d.date === e.target.value); if (i >= 0) { day = i; composer = null; render(); } else { toast("示例里只有 11月7日 到 11月9日", e.target); e.target.value = days[day].date; } }
  if (e.target.id === "discDate") { dateFilter = e.target.value; render(); }
});

document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === "noteForm") {
    const input = $("#noteInput"), text = example(input);
    if (!text) return;
    const note = { text, status: "processing" };
    notes.unshift(note);
    const it = mk({ q: 1, proj: "记一下", state: "整理中", title: "整理中｜" + text, next: "正在读这条记录，判断归到哪个项目…", evi: ["记一下 · 刚刚"], hist: [{ d: "刚刚", t: "你记下：" + text, isNew: true }], fresh: true });
    items.push(it); quad = 1; render();
    toast("已记下，正在整理", $("#noteComposer") || $("#noteBtn"));
    setTimeout(() => {
      it.proj = "个人"; it.state = "进行中"; it.title = "个人｜" + text; it.due = "本周内";
      it.next = "本周内约个时间，先把要点列出来发给对方。";
      it.bg = "来自你在“记一下”里写的一句话，已归入个人事项。"; it.fresh = true;
      note.status = "done"; note.feedback = "已整理成事项，放在「重要不紧急」。";
      if (page === "today") { render(); toast("已整理成事项", document.querySelector(`[data-card="${it.id}"]`)); }
    }, 1400);
    return;
  }
  if (f.dataset.replyForm) {
    const id = f.dataset.replyForm, it = find(id), input = f.querySelector("input"), text = example(input);
    if (!text) return;
    it.hist.forEach(h => { h.isNew = false; });
    it.hist.push({ d: "刚刚", t: "你的回应：" + text, isNew: true });
    composer = { id, sent: text }; render();
    toast("已作为新痕迹存档", document.querySelector(`[data-card="${id}"] .desk-saved-note`));
    return;
  }
  if (f.dataset.discForm) {
    const id = f.dataset.discForm, it = discoveries.find(d => d.id === id), ta = f.querySelector("textarea"), text = example(ta);
    if (!text) return;
    it.response = { text, feedback: "" }; replyDisc = null; render();
    toast("已记下这条回应", document.querySelector(`[data-disc-card="${id}"] .discovery-response`));
    setTimeout(() => { it.response.feedback = "好的，之后找类似内容时会参考这一点。"; if (page === "discoveries") render(); }, 1200);
    return;
  }
  if (f.id === "attentionForm") {
    const input = $("#attentionInput"), text = input.value.trim() || "多看看跑步";
    attentionNote = text; render(); toast("已记下，明天起按新的关注点找", $("#attentionForm"));
    return;
  }
});

document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (document.querySelector(".desk-dialog-backdrop")) { closeDialog(); return; }
  closePopovers(); unfit(); post();
});

window.addEventListener("load", post);
window.addEventListener("resize", post);
if (window.ResizeObserver) new ResizeObserver(post).observe(document.body);
render();
</script>
</body>
</html>
